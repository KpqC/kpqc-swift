name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  known-answer-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - name: Validate all known-answer vectors
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: ./scripts/test.sh

  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - run: ./scripts/test.sh
      - run: test -z "$(git status --short --untracked-files=all -- Sources/KpqCCore/Generated)"
      - run: swift package dump-package
      - run: swift test
      - run: gem install cocoapods --no-document
      - run: pod lib lint KpqC.podspec
